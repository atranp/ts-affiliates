<div class="mx-auto max-w-[1600px] px-6 py-8">

<script>
const money = n => '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

const NAV = [
  ['Home','home',   'M3 10.5 12 3l9 7.5M5.5 9.5V20h13V9.5'],
  ['Promote','',    'M13 7 4 16v4h4l9-9M14.5 5.5l4 4'],
  ['Traffic','traffic','M4 19V9m5 10V5m5 14v-7m5 7V8'],
  ['Commissions','commissions','M4 6h16v12H4zM4 10h16'],
  ['Team','',       'M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2 20a6 6 0 0 1 12 0M17 11a3 3 0 1 0 0-6M16 20h6a5 5 0 0 0-4-4.9'],
  ['Payouts','',    'M3 7h18v10H3zM3 11h18M7 15h3'],
  ['Settings','',   'M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z'],
];

function icon(d, cls='h-4 w-4'){
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
}

function sidebar(active){
  return `
  <aside class="hidden w-[212px] shrink-0 flex-col border-r border-line bg-white lg:flex">
    <div class="flex items-center gap-2.5 px-4 py-4">
      <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-brand text-[11px] font-bold text-white">TS</div>
      <div class="leading-tight">
        <p class="text-[13px] font-semibold">Ambassador</p>
        <p class="text-[11px] text-muted">Portal</p>
      </div>
    </div>
    <nav class="flex-1 space-y-0.5 px-2 pb-4">
      ${NAV.map(([label,key,d])=>{
        const on = key && key===active;
        return `<a class="flex items-center gap-2.5 rounded-lg px-2.5 py-2 text-[13px] font-medium ${on?'bg-primarySoft text-brand':'text-muted hover:bg-bg hover:text-ink'}">
          ${icon(d)}<span>${label}</span></a>`}).join('')}
    </nav>
    <div class="border-t border-line p-3">
      <div class="flex items-center gap-2.5">
        <div class="flex h-7 w-7 items-center justify-center rounded-full bg-brandLite/20 text-[11px] font-semibold text-brand">B</div>
        <div class="min-w-0 leading-tight">
          <p class="truncate text-[12px] font-medium">Blair</p>
          <p class="truncate text-[10px] text-muted">Ambassador</p>
        </div>
      </div>
    </div>
  </aside>`;
}

function periodBar(extra=''){
  return `
  <div class="flex flex-wrap items-center gap-2">
    <div class="flex rounded-lg border border-line bg-white p-0.5 shadow-xs">
      ${['This week','Last week','This month','Since last payout','Custom']
        .map((l,i)=>`<button class="rounded-md px-2.5 py-1.5 text-[12px] font-medium ${i===0?'bg-brand text-white':'text-muted hover:text-ink'}">${l}</button>`).join('')}
    </div>
    <span class="text-[11px] text-muted">Mar 24 – Mar 30 · compared to Mar 17 – Mar 23</span>
    ${extra}
  </div>`;
}

function delta(pct, good=true){
  const up = pct >= 0;
  const tone = (up===good) ? 'text-success' : 'text-danger';
  const arrow = up ? 'M12 19V5M5 12l7-7 7 7' : 'M12 5v14M5 12l7 7 7-7';
  return `<span class="inline-flex items-center gap-0.5 text-[11px] font-semibold ${tone}">
    ${icon(arrow,'h-3 w-3')}${Math.abs(pct)}%</span>`;
}

function stat({label, value, sub, d, good=true, tone='', hint=''}){
  return `
  <div class="rounded-xl border border-line bg-card p-3.5 shadow-card">
    <p class="text-[11px] font-medium uppercase tracking-wide text-muted">${label}</p>
    <div class="mt-1.5 flex items-baseline gap-2">
      <span class="tabnum text-[22px] font-semibold leading-none ${tone}">${value}</span>
      ${d!==undefined?delta(d,good):''}
    </div>
    <p class="mt-1.5 text-[11px] text-muted">${sub||''}</p>
    ${hint?`<p class="mt-1 text-[10px] text-muted/80">${hint}</p>`:''}
  </div>`;
}

const EARN = [42,0,88,120,64,0,156,210,98,45,0,132,175,240,190,88,0,60,142,205,168,95,40,0,118,186,232,144,76,0];
function chart(h=140){
  const peak = Math.max(...EARN);
  return `
  <div class="rounded-xl border border-line bg-card p-4 shadow-card">
    <div class="flex items-start justify-between">
      <div>
        <p class="text-[13px] font-semibold">Earnings</p>
        <p class="text-[11px] text-muted">Daily, this period</p>
      </div>
      <div class="flex items-center gap-3 text-[11px]">
        <span class="flex items-center gap-1.5"><i class="h-2 w-2 rounded-sm bg-brand"></i>Your sales</span>
        <span class="flex items-center gap-1.5"><i class="h-2 w-2 rounded-sm bg-brandLite"></i>Team</span>
      </div>
    </div>
    <div class="mt-4 flex items-end gap-[3px]" style="height:${h}px">
      ${EARN.map((v,i)=>{
        const teamPart = i%4===0 ? 0.35 : 0;
        const total = Math.max((v/peak)*100, v?3:1.5);
        return `<div class="group relative flex-1">
          <div class="w-full rounded-t-[3px] bg-brandLite" style="height:${total*teamPart}px"></div>
          <div class="w-full rounded-t-[3px] bg-brand/85 transition-colors group-hover:bg-brand" style="height:${(total*(1-teamPart))*(h/100)}px"></div>
        </div>`}).join('')}
    </div>
    <div class="mt-2 flex justify-between text-[10px] text-muted"><span>Mar 1</span><span>Mar 30</span></div>
  </div>`;
}

const badge = (txt,kind)=>{
  const map={paid:'bg-successSoft text-success',unpaid:'bg-primarySoft text-primary',pending:'bg-warningSoft text-warning'};
  return `<span class="inline-flex rounded-full px-2 py-0.5 text-[10px] font-semibold ${map[kind]}">${txt}</span>`;
};

// Two values only, because that is all the data supports. A commission either
// carries a visit_id or it does not.

let screen='home', view='both';

function render(){
  const desktop = `
    <figure class="m-0">
      <figcaption class="mb-2 flex items-center gap-2 text-[11px] font-medium uppercase tracking-wide text-slate-500">
        <span class="rounded bg-white px-2 py-0.5 shadow-xs">Desktop</span><span class="font-normal normal-case">1440 × 900</span>

        <div class="flex h-[760px]">${D[screen]}</div>

    </figure>`;

  const mobile = `
    <figure class="m-0">
      <figcaption class="mb-2 flex items-center gap-2 text-[11px] font-medium uppercase tracking-wide text-slate-500">
        <span class="rounded bg-white px-2 py-0.5 shadow-xs">Mobile</span><span class="font-normal normal-case">390 × 844</span>
      </figcaption>
      <div class="w-[390px] overflow-hidden rounded-[2rem] border-[10px] border-slate-800 bg-white shadow-pop">
        <div class="flex h-[800px] flex-col">${M[screen]}</div>
      </div>
    </figure>`;

  document.getElementById('stage').innerHTML =
    view==='desktop' ? desktop : view==='mobile' ? mobile : desktop + mobile;

  document.querySelectorAll('.screen-tab').forEach(b=>{
    const on = b.dataset.screen===screen;
    b.className = `screen-tab rounded-md px-3 py-1.5 text-xs font-medium ${on?'bg-brand text-white shadow-xs':'text-slate-500 hover:text-slate-900'}`;
  });
  document.querySelectorAll('.view-tab').forEach(b=>{
    const on = b.dataset.view===view;
    b.className = `view-tab rounded-md px-3 py-1.5 text-xs font-medium ${on?'bg-brand text-white shadow-xs':'text-slate-500 hover:text-slate-900'}`;
  });
}

document.getElementById('screenTabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-screen]'); if(!b) return; screen=b.dataset.screen; render();
});
document.getElementById('viewTabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-view]'); if(!b) return; view=b.dataset.view; render();
});

render();
